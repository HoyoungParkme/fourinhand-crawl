# v{버전} 태그를 올리면 설치 파일을 만들어 같은 이름의 Release에 올린다(INFRA 8.4)
# 빌드는 로컬과 같은 scripts/build.ps1 — 설치 파일 이름을 영문으로 바꾸고 20MB를 넘으면 실패한다.
# 크기 확인이 Release를 만들기 전에 끝나야 해서, Release는 빌드가 다 된 뒤 gh로 만든다
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - name: 태그와 설정의 버전 대조
        shell: pwsh
        run: |
          $version = (Get-Content backend/tauri.conf.json -Raw -Encoding utf8 | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            Write-Error "태그 $env:TAG 와 backend/tauri.conf.json 의 버전 $version 이 다르다"
            exit 1
          }
          "VERSION=$version" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: 화면 의존성
        run: npm ci
        working-directory: frontend

      - name: 코어 테스트
        run: cargo test --locked
        working-directory: backend

      - name: 설치 파일 만들기
        shell: pwsh
        run: ./scripts/build.ps1

      - name: Release 만들기
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = "backend/target/release/bundle/nsis/PawinhandBigCat_${env:VERSION}_x64-setup.exe"
          $notes = @"
          ## 설치
          1. 아래 **PawinhandBigCat_${env:VERSION}_x64-setup.exe**를 내려받아 실행합니다
          2. 파란 창 「Windows의 PC 보호」가 뜨면 **추가 정보** → **실행**을 누릅니다(코드 서명을 하지 않은 앱이라 뜹니다)
          3. 이전 버전이 깔려 있으면 그 위에 덮어 설치됩니다

          자세한 안내는 [README](https://github.com/HoyoungParkme/fourinhand-crawl#설치)에 있습니다.

          > 포인핸드 공식 앱이 아닙니다. 포인핸드에 공개된 보호 동물 공고를 모아 보여줍니다.
          "@
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release create $env:TAG $setup --verify-tag --title "포인핸드 대형묘 찾기 ${env:VERSION}" --notes-file release-notes.md
