[package]
name = "pawinhand-big-cat"
# 앱 버전은 tauri.conf.json 한 곳에서만 관리한다(INFRA 8.4). 이 값은 쓰지 않는다
version = "0.0.0"
description = "포인핸드 대형묘 찾기"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TLS는 Windows 기본(Schannel)을 쓴다 — 따로 빌드할 암호 라이브러리가 없다
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
percent-encoding = "2.3"
form_urlencoded = "1.2"
tokio = { version = "1", features = ["sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
